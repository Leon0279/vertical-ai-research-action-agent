name: vaa

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vertical_ai_research_action_agent}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  db-init:
    image: pgvector/pgvector:pg16
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-vertical_ai_research_action_agent}
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - ./docs/sql:/schema:ro
    command:
      - /bin/sh
      - -ec
      - |
        for file in /schema/*.sql; do
          echo "Applying $${file##*/}"
          psql --set ON_ERROR_STOP=1 --file "$$file"
        done

  api:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      VAA_SKIP_DOTENV: "1"
      APP_LOG_PATH: /app/logs/app.jsonl
      REDIS_SESSION_MEMORY_URL: redis://redis:6379/0
      POSTGRES_PROJECT_PROFILE_MEMORY_DSN: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-vertical_ai_research_action_agent}
      POSTGRES_DECISION_MEMORY_DSN: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-vertical_ai_research_action_agent}
      POSTGRES_ACTION_MEMORY_DSN: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-vertical_ai_research_action_agent}
      POSTGRES_PREFERENCE_POLICY_MEMORY_DSN: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-vertical_ai_research_action_agent}
      POSTGRES_RESEARCH_KNOWLEDGE_MEMORY_DSN: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-vertical_ai_research_action_agent}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ./app:/app/app:ro
      - ./tests:/app/tests:ro
      - ./main.py:/app/main.py:ro
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    command:
      - python
      - -m
      - uvicorn
      - main:app
      - --reload
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=5).read()
      interval: 10s
      timeout: 6s
      retries: 18
      start_period: 20s

volumes:
  postgres_data:
    name: vaa-postgres-data
    external: true
  redis_data:
    name: vaa-redis-data
    external: true
